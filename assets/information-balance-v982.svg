<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Cortex v9.8.2 information-balanced task selection</title>
  <desc id="desc">Task information p times one minus p peaks near fifty percent success. Floor and ceiling tasks are rejected, informative development levels select a separate sealed held-out corpus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17112d"/></linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="50" y="55" fill="#f8fafc" font-family="Inter,Segoe UI,Arial" font-size="28" font-weight="700">CORTEX / INFORMATION-BALANCED CALIBRATION</text>
  <text x="50" y="86" fill="#94a3b8" font-family="Inter,Segoe UI,Arial" font-size="15">Choose experiments at the capability boundary, then seal a different corpus for confirmation.</text>

  <rect x="50" y="122" width="690" height="380" rx="18" fill="#0b1525" stroke="#26364f"/>
  <text x="80" y="158" fill="#67e8f9" font-family="ui-monospace,Consolas" font-size="18">I(task) = p(1-p)</text>
  <line x1="100" y1="440" x2="690" y2="440" stroke="#64748b"/>
  <line x1="100" y1="190" x2="100" y2="440" stroke="#64748b"/>
  <rect x="277" y="190" width="236" height="250" fill="#8b5cf6" opacity=".10"/>
  <path d="M100 440 C250 120 540 120 690 440" fill="none" stroke="url(#curve)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="395" cy="190" r="9" fill="#f8fafc"/>
  <text x="395" y="178" fill="#f8fafc" font-family="Inter,Segoe UI,Arial" font-size="14" text-anchor="middle">maximum information</text>
  <text x="100" y="468" fill="#fbbf24" font-family="Inter,Segoe UI,Arial" font-size="13" text-anchor="middle">floor</text>
  <text x="277" y="468" fill="#c4b5fd" font-family="ui-monospace,Consolas" font-size="13" text-anchor="middle">p=.30</text>
  <text x="395" y="468" fill="#f8fafc" font-family="ui-monospace,Consolas" font-size="13" text-anchor="middle">p=.50</text>
  <text x="513" y="468" fill="#c4b5fd" font-family="ui-monospace,Consolas" font-size="13" text-anchor="middle">p=.70</text>
  <text x="690" y="468" fill="#fbbf24" font-family="Inter,Segoe UI,Arial" font-size="13" text-anchor="middle">ceiling</text>
  <text x="90" y="205" fill="#94a3b8" font-family="ui-monospace,Consolas" font-size="12" text-anchor="end">.25</text>
  <text x="90" y="444" fill="#94a3b8" font-family="ui-monospace,Consolas" font-size="12" text-anchor="end">0</text>
  <text x="395" y="494" fill="#a78bfa" font-family="Inter,Segoe UI,Arial" font-size="13" text-anchor="middle">retained development window</text>

  <text x="790" y="155" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700">SEALED EXPERIMENT FLOW</text>
  <rect x="790" y="185" width="340" height="58" rx="12" fill="#0e7490" opacity=".85"/>
  <text x="960" y="219" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="16" text-anchor="middle">difficulty ladder / development</text>
  <path d="M960 243V273" stroke="#64748b" stroke-width="2"/>
  <path d="M953 265L960 275L967 265" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="790" y="275" width="340" height="58" rx="12" fill="#6d28d9" opacity=".9"/>
  <text x="960" y="309" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="16" text-anchor="middle">select level maximizing p(1-p)</text>
  <path d="M960 333V363" stroke="#64748b" stroke-width="2"/>
  <path d="M953 355L960 365L967 355" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="790" y="365" width="340" height="72" rx="12" fill="#047857" opacity=".9"/>
  <text x="960" y="395" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="16" text-anchor="middle">disjoint held-out corpus seal</text>
  <text x="960" y="419" fill="#a7f3d0" font-family="Inter,Segoe UI,Arial" font-size="12" text-anchor="middle">public prompts · private answer commitment</text>
  <text x="960" y="475" fill="#fbbf24" font-family="Inter,Segoe UI,Arial" font-size="13" text-anchor="middle">UNEXECUTED ≠ EVIDENCE</text>
  <text x="1145" y="530" fill="#475569" font-family="ui-monospace,Consolas" font-size="11" text-anchor="end">MODEL-NEUTRAL · ADVISORY · NO AUTHORITY EFFECT</text>
</svg>
