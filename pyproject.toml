[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-memory"
version = "8.7.0"
description = "Identity-bound predictive memory and measurement runtime for persistent software agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "James Paul Jackson"}]
keywords = ["codex", "rag", "memory", "repository", "sqlite", "agents", "neural", "interlink"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
cortex = "cortex.cli:main"
cortex-mcp = "cortex.mcp:main"
cortex-attach = "cortex.attach:attach_main"

[tool.setuptools.packages.find]
include = ["cortex*", "thalamus*"]

[tool.setuptools.package-data]
"cortex.aria_meta" = [
  "INTERNAL_ARIA.json",
  "vendor/**/*",
  "vendor/**/.*",
  "vendor/.github/workflows/*.yml",
]

[tool.setuptools.exclude-package-data]
"cortex.aria_meta" = [
  "vendor/.aria/*",
  "vendor/.aria/**/*",
  "vendor/**/__pycache__/*",
  "vendor/**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
