name: Star lattice pages

# Host the live lattice HTML (fetch-on-reload) on GitHub Pages — first-party only.

on:
  push:
    branches: [main]
    paths:
      - "assets/star-lattice.html"
      - "assets/star-metrics.json"
      - "assets/embed.html"
      - "assets/embed-cortex.ps1"
      - "assets/embed-cortex.sh"
      - ".github/workflows/star-lattice-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-star-lattice
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          cp assets/star-lattice.html _site/index.html
          cp assets/star-lattice.html _site/star-lattice.html
          # Same-origin metrics for live reload (no browser api.github.com / 401)
          cp assets/star-metrics.json _site/star-metrics.json
          # Desktop embed HUD + first-party installer scripts
          cp assets/embed.html _site/embed.html
          cp assets/embed-cortex.ps1 _site/embed-cortex.ps1
          cp assets/embed-cortex.sh _site/embed-cortex.sh

      # Creates the Pages site if missing (Settings → Pages was never set).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
