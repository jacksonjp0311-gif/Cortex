name: Star lattice refresh

# Keep the README SVG current from first-party GitHub metrics (gh api).
# Live reload (fetch on every open) lives in assets/star-lattice.html.

on:
  schedule:
    # Hourly — README markdown cannot run JS on view; this is the embed refresh path.
    - cron: "17 * * * *"
  watch:
    types: [started]
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_star_lattice.py"
      - ".github/workflows/star-lattice.yml"

permissions:
  contents: write

concurrency:
  group: star-lattice
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Allow bot commit + push of lattice assets
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull metrics and rebuild SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No --force: skip commit noise when star series fingerprint is unchanged.
          python scripts/build_star_lattice.py \
            --repo "${{ github.repository }}" \
            --patch-readme

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-lattice.svg assets/star-lattice.fingerprint \
            assets/star-metrics.json README.md || true
          if git diff --staged --quiet; then
            echo "No lattice changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh star lattice from live stargazer metrics"
          git push
