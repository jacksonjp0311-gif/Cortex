name: Cortex neural interlink tests

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q cortex thalamus tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Controlled benchmark gates
        run: python -m cortex benchmark --verify --json
      # Benchmark scripts may be invoked as files (sys.path[0]=benchmarks/).
      # Repo-root PYTHONPATH keeps cortex importable without editable install.
      - name: Fluency corpus
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python benchmarks/aria_fluency_evaluation.py
      - name: Foreign host matrix
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python benchmarks/foreign_host_matrix.py
      - name: Teach-seed smoke (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_teach_seed.py
      - name: Retrieval path-recall gate (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_retrieval_gate.py
      - name: Immune gate smoke (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_immune_gate.py
      - name: Connect metric graph smoke (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_connect_metrics.py
      - name: V5 substrate smoke (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_v5_substrate.py
      - name: Interconnect mesh smoke (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_interconnect_mesh.py
      - name: Spectral kernels smoke (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_spectral_kernels.py
      - name: Bash syntax
        if: runner.os != 'Windows'
        run: bash -n cortex.sh cortex-all-one.sh scripts/bash/*.sh
      - name: Bash portable smoke
        if: runner.os != 'Windows'
        run: bash ./cortex-all-one.sh --repository-path . --name CortexSelf --task "Inspect the portable engine"
      - name: PowerShell launcher smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: .\cortex.ps1 doctor --json
