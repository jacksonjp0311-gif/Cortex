name: Cortex neural interlink tests

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev tools
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q cortex thalamus tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Pytest constitutional seal gates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >
          python -m pytest
          tests/test_evidence_kernel.py
          tests/test_controller_firewall.py
          tests/test_activation_fail_closed.py
          tests/test_lineage_graph.py
          tests/test_immunity_scan.py
          tests/test_quarantine.py
          tests/test_causal_unlearning.py
          tests/test_ranker_rebuild.py
          tests/test_independent_witness.py
          tests/test_repair_readmission.py
          tests/test_promotion_independence.py
          tests/test_memory_simplex.py
          tests/test_epoch.py
          tests/test_phases.py
          tests/test_continuity.py
          tests/test_interconnect_continuity.py
          tests/test_v71_integration.py
          tests/test_constitutional_geometry.py
          tests/test_constitutional_path.py
          tests/test_observation_nonmutation.py
          tests/test_geometry_seal.py
          tests/test_field_channels.py
          tests/test_resonant_frame_math.py
          tests/test_field_comparator.py
          tests/test_field_policy.py
          tests/test_field_receipt.py
          tests/test_resonant_frame_integration.py
          tests/test_resonant_frame_nonmutation.py
          tests/test_realign.py
          tests/test_self_sensing.py
          tests/test_warm_in.py
          tests/test_binding_field.py
          -q --tb=line
      - name: Constitutional seal release receipt
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v6251.py
      - name: Geometry Seal receipt (v7.1.1 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v711.py
      - name: Resonant Frames receipt (v7.3.0 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v730.py
      - name: Continuity Realignment receipt (v7.4.0 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v740.py
      - name: Self-Sensing Field receipt (v7.5.0 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v750.py
      - name: Warm-In / VOR receipt (v7.6.0 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v760.py
      - name: Binding Field receipt (v7.7.0 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v770.py
      - name: Epoch-Atomic Temporal Boundary receipt (v7.7.2 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v772.py
      - name: Event-Sourced Temporal Accrual receipt (v7.8.0 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v780.py
      - name: Truth Recovery receipt (v7.8.1 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v781.py
      - name: Measured Predictive Self-Model receipt (v8.0.0 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v800.py
      - name: Informational Interlocks receipt (v8.2.0 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v820.py
      - name: Geometric Bridge Field receipt (v8.2.1 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v821.py
      - name: Query-Conditioned Bridge Trials receipt (v8.2.2 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v822.py
      - name: Source Admission Field receipt (v8.2.3 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v823.py
      - name: Selective Admission / Ranker Attribution receipt (v8.2.4 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v824.py
      - name: Resonance Frequency Sweep receipt (v8.2.5 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v825.py
      - name: Four-Dimensional Geometric Echo receipt (v8.2.6 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v826.py
      - name: Rotated Echo Alignment receipt (v8.2.7 hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/release_receipt_v827.py
      - name: Upload release receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constitutional-seal-receipt-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            work/release_receipt_v6251.json
            work/release_receipt_v711.json
            work/release_receipt_v730.json
            work/release_receipt_v740.json
            work/release_receipt_v750.json
            work/release_receipt_v760.json
            work/release_receipt_v770.json
            work/release_receipt_v772.json
            work/release_receipt_v780.json
            work/release_receipt_v781.json
            work/release_receipt_v800.json
            work/release_receipt_v820.json
            work/release_receipt_v821.json
            work/release_receipt_v822.json
            work/release_receipt_v823.json
            work/release_receipt_v824.json
            work/release_receipt_v825.json
            work/release_receipt_v826.json
            work/release_receipt_v827.json
          if-no-files-found: ignore
      - name: Controlled benchmark gates
        run: python -m cortex benchmark --verify --json
      # Benchmark scripts may be invoked as files (sys.path[0]=benchmarks/).
      # Repo-root PYTHONPATH keeps cortex importable without editable install.
      - name: Fluency corpus
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python benchmarks/aria_fluency_evaluation.py
      - name: Foreign host matrix
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python benchmarks/foreign_host_matrix.py
      - name: Teach-seed smoke (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_teach_seed.py
      - name: Retrieval path-recall gate (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_retrieval_gate.py
      - name: Immune gate smoke (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_immune_gate.py
      - name: Connect metric graph smoke (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_connect_metrics.py
      - name: V5 substrate smoke (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_v5_substrate.py
      - name: Interconnect mesh smoke (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_interconnect_mesh.py
      - name: Spectral kernels smoke (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_spectral_kernels.py
      - name: Multi-agent token gate smoke (this repo only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ci/smoke_multi_agent.py
      - name: Bash syntax
        if: runner.os != 'Windows'
        run: bash -n cortex.sh cortex-all-one.sh scripts/bash/*.sh
      - name: Bash portable smoke
        if: runner.os != 'Windows'
        run: bash ./cortex-all-one.sh --repository-path . --name CortexSelf --task "Inspect the portable engine"
      - name: PowerShell launcher smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: .\cortex.ps1 doctor --json
